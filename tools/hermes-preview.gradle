// Catholic Hermes 1.8.x preview: stable separate package installable beside 1.7 and 1.8.
// Usage: ./gradlew -I tools/hermes-preview.gradle :app:assembleDebug
// Production applicationId, signing and version stay untouched.
def HERMES_VERSION_CODE = 24
def HERMES_VERSION_NAME = '1.8.15'

gradle.beforeProject { project ->
    project.pluginManager.withPlugin('com.android.application') {
        project.android.buildFeatures.resValues = true
        // Reuse the available preview key; keep private keys outside Git.
        def privateKeystore = project.providers.gradleProperty('hermesSigningKeystore').orNull
        if (privateKeystore != null) {
            // finalizeDsl runs after app/build.gradle.kts has created debugConfig.
            project.androidComponents.finalizeDsl { ext ->
                ext.signingConfigs.getByName('debugConfig').storeFile = project.file(privateKeystore)
            }
        }
        project.android.buildTypes.named('debug') {
            applicationIdSuffix = '.hermespreview'
            resValue 'string', 'app_name', "Catholic Hermes ${HERMES_VERSION_NAME}"
        }
        project.androidComponents.onVariants(project.androidComponents.selector().withBuildType('debug')) { variant ->
            variant.outputs.each { output ->
                output.versionCode.set(HERMES_VERSION_CODE)
                output.versionName.set(HERMES_VERSION_NAME)
            }
        }
    }
}

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    app.tasks.matching { it.name == 'packageDebug' }.configureEach {
        doFirst {
            def signing = app.android.buildTypes.getByName('debug').signingConfig
            def store = java.security.KeyStore.getInstance(signing.storeFile, signing.storePassword.toCharArray())
            def certificate = store.getCertificate(signing.keyAlias)
            if (certificate == null) throw new GradleException('No se encontró el alias de la firma Hermes Preview.')
            def fingerprint = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
            if (fingerprint != 'b634b6b8a98206f9f5a7251b892103e5ddc504ef38a7cc84a0330e4e612c83d9') {
                throw new GradleException('La clave no corresponde a Hermes Preview 1.8.1. Indica -PhermesSigningKeystore=/ruta/privada/clave.keystore con la firma B634B6B8 antes de crear la APK.')
            }
        }
    }
}
