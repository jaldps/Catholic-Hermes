name: Android build and visual identity smoke check

on:
  push:
    branches: ["main", "catholicgpt-aaa-themes"]
  pull_request:
    branches: ["main"]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Generate debug signing key required by project
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Build debug APK
        id: build_apk
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Catholic-Hermes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Catholic-Hermes-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Capture all six theme combinations in an emulator
        if: always() && steps.build_apk.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-snapshot-save
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/capture-visual-themes.py

      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sancta-Fides-visual-review
          path: visual-snapshots/*.png
          if-no-files-found: warn
          retention-days: 14
