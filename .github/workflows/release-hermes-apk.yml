# Builds, signs and publishes the Catholic Hermes 1.8.x preview APK as a GitHub Release.
# Runs when the preview version changes on CatholicGPT (tools/hermes-preview.gradle),
# or by hand from the Actions tab. The APK never goes through Git, so its size is not
# limited by GitHub's 100 MB file cap.
#
# One-time setup (repository owner): add the secret HERMES_KEYSTORE_B64 with the base64
# of the private Hermes Preview keystore (certificate SHA-256 b634b6b8…83d9).
# The build refuses any other key (tools/hermes-preview.gradle checks the fingerprint).
name: Release Hermes preview APK

on:
  push:
    branches: [CatholicGPT]
    paths: [tools/hermes-preview.gradle]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hermes-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read preview version
        id: version
        run: |
          name=$(sed -n "s/^def HERMES_VERSION_NAME = '\(.*\)'/\1/p" tools/hermes-preview.gradle)
          code=$(sed -n 's/^def HERMES_VERSION_CODE = \([0-9]*\)/\1/p' tools/hermes-preview.gradle)
          test -n "$name" && test -n "$code"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"

      - name: Skip if the release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing secret
        if: steps.exists.outputs.skip == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.HERMES_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing secret HERMES_KEYSTORE_B64 (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        if: steps.exists.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        if: steps.exists.outputs.skip == 'false'

      - name: Install Android SDK 36.1
        if: steps.exists.outputs.skip == 'false'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.1.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.exists.outputs.skip == 'false'

      - name: Build signed APK
        if: steps.exists.outputs.skip == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.HERMES_KEYSTORE_B64 }}
        run: |
          keystore="$RUNNER_TEMP/hermes-preview.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cp "$keystore" debug.keystore
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache -I tools/hermes-preview.gradle \
            -PhermesSigningKeystore="$keystore" :app:assembleDebug
          rm -f "$keystore" debug.keystore

      - name: Verify signature and package
        if: steps.exists.outputs.skip == 'false'
        id: apk
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_SDK_ROOT/build-tools/36.1.0"
          "$bt/apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -q 'SHA-256 digest: b634b6b8a98206f9f5a7251b892103e5ddc504ef38a7cc84a0330e4e612c83d9' certs.txt
          "$bt/aapt2" dump badging "$apk" | head -1 | tee badging.txt
          grep -q "name='com.aistudio.sanctafides.qvmrpx.hermespreview'" badging.txt
          grep -q "versionCode='${{ steps.version.outputs.code }}'" badging.txt
          out="Catholic-Hermes-${{ steps.version.outputs.name }}.apk"
          cp "$apk" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$out" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c %s "$out")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          Catholic Hermes ${{ steps.version.outputs.name }} (código ${{ steps.version.outputs.code }}), compilada desde \`${{ github.sha }}\`.

          - Paquete: \`com.aistudio.sanctafides.qvmrpx.hermespreview\`; actualiza las versiones 1.8.x anteriores.
          - Certificado SHA-256: \`b634b6b8a98206f9f5a7251b892103e5ddc504ef38a7cc84a0330e4e612c83d9\`
          - APK SHA-256: \`${{ steps.apk.outputs.sha }}\` · ${{ steps.apk.outputs.bytes }} bytes

          Novedades: [dist/README.md](https://github.com/${{ github.repository }}/blob/CatholicGPT/dist/README.md). No se ha probado en un teléfono físico.
          NOTES
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.apk.outputs.file }}" \
            --target "${{ github.sha }}" --prerelease \
            --title "Catholic Hermes ${{ steps.version.outputs.name }}" --notes-file notes.md
